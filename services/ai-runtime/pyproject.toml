[project]
name = "nexa-ai-runtime"
version = "0.1.0"
description = "Stateless model plane for Nexa Chess AI tasks (docs/ai/architecture/PHASE1_SPEC.md)."
requires-python = ">=3.12,<3.13"
# Runtime dependencies are deliberately few and contain no provider SDK or
# HTTP client (tests/test_dependencies.py enforces an allowlist over uv.lock).
# uvicorn without [standard]: no native uvloop/httptools.
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.9,<3",
  "pyjwt>=2.9,<3",
  "uvicorn>=0.32,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.27,<1",
  "jsonschema>=4.23,<5",
  "pytest>=8.3,<9",
]

[tool.uv]
package = false
# Resolve nothing published after this date: a brand-new release gets time to
# be yanked before it can land here. Move it forward deliberately when bumping.
exclude-newer = "2026-10-01T00:00:00Z"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = [
  # starlette 1.x TestClient nudges towards httpx2; httpx is what we pin.
  "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
