<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Be right back</title>
<!--
  Served by nginx (not the app) when the web app can't answer: 502/504 while a
  container restarts or has crashed, 503 during maintenance. Everything is inline
  because nothing else on this host may be reachable. Same layout as the app's 404
  (apps/web/src/app/not-found.tsx). The brand line is Nexa Chess on Nexa's hosts, an
  academy's cached name (localStorage "nexa-brand") on its own address, else hidden.
  Colours mirror apps/web/src/styles/globals.css.
  docs/SERVICE_STATUS.md
-->
<style>
  :root {
    --bg: rgb(255 255 255); --surface: rgb(255 255 255); --soft: rgb(245 245 245);
    --border: rgb(229 229 229); --line: rgb(138 138 138);
    --text: rgb(23 23 23); --muted: rgb(82 82 82); --subtle: rgb(112 112 112);
    --emphasis: rgb(15 30 58);
    --button: rgb(47 95 208); --button-hover: rgb(38 79 176); --on-button: rgb(255 255 255);
    --accent: rgb(233 190 114);
    --focus: rgb(47 95 208);
    --control-h: 44px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: rgb(10 10 10); --surface: rgb(23 23 23); --soft: rgb(31 31 31);
      --border: rgb(38 38 38); --line: rgb(115 115 115);
      --text: rgb(245 245 245); --muted: rgb(163 163 163); --subtle: rgb(140 140 140);
      --emphasis: rgb(245 245 245);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: rgb(10 10 10); --surface: rgb(23 23 23); --soft: rgb(31 31 31);
    --border: rgb(38 38 38); --line: rgb(115 115 115);
    --text: rgb(245 245 245); --muted: rgb(163 163 163); --subtle: rgb(140 140 140);
    --emphasis: rgb(245 245 245);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; min-height: 100dvh; padding: 48px 16px;
  }
  main { width: 100%; max-width: 36rem; text-align: center; display: flex; flex-direction: column; align-items: center; }
  .brand { margin: 0 0 32px; font-size: 1.25rem; font-weight: 700; letter-spacing: -0.01em; color: var(--emphasis); }
  .code {
    margin: 0; font-size: 6rem; line-height: 1; font-weight: 800; letter-spacing: -0.02em;
    color: var(--emphasis); font-variant-numeric: tabular-nums;
  }
  .code svg { display: block; width: 6rem; height: 6rem; }
  .spin svg { animation: spin 1.6s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin svg { animation: none; } }
  .bar { display: block; width: 80px; height: 6px; margin: 32px 0; border-radius: 999px; background: var(--accent); }
  h1 { margin: 0; font-size: 1.5rem; line-height: 1.25; font-weight: 700; letter-spacing: -0.01em; color: var(--emphasis); }
  p { margin: 0; color: var(--muted); }
  .lead { margin-top: 12px; font-size: 1rem; }
  .eta { margin-top: 12px; color: var(--text); font-weight: 600; }
  .actions { margin-top: 32px; display: flex; flex-direction: column; align-items: center; gap: 12px; width: 100%; }
  button {
    width: 100%; min-height: var(--control-h); padding: 8px 24px; border-radius: 8px; cursor: pointer;
    border: 1px solid transparent; background: var(--button); color: var(--on-button);
    font: inherit; font-size: 0.875rem; font-weight: 500;
  }
  button:hover { background: var(--button-hover); }
  button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  button:disabled { cursor: default; opacity: 0.6; }
  .check { display: flex; align-items: center; gap: 8px; font-size: 0.875rem; color: var(--muted); }
  .dot { width: 8px; height: 8px; border-radius: 999px; background: var(--button); }
  .checking .dot { animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.3; } }
  .hint { margin-top: 32px; font-size: 0.875rem; }
  footer { margin-top: 16px; font: 0.75rem/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: var(--subtle); }
  @media (min-width: 640px) {
    .code { font-size: 8rem; }
    .code svg { width: 8rem; height: 8rem; }
    h1 { font-size: 1.875rem; }
    .lead { font-size: 1.125rem; }
    button { width: auto; min-width: 12rem; }
  }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <p class="brand" id="brand" hidden></p>
  <div class="code" id="code" aria-hidden="true">502</div>
  <span class="bar" aria-hidden="true"></span>
  <h1 id="title">We'll be right back</h1>
  <p class="lead" id="body">The app isn't responding at the moment. We're retrying automatically, so there's no need to refresh.</p>
  <p class="eta" id="eta" hidden></p>
  <div class="actions">
    <button id="retry" type="button">Try now</button>
    <div class="check" id="check" role="status" aria-live="polite">
      <span class="dot" aria-hidden="true"></span>
      <span id="checkText">Checking again shortly</span>
    </div>
  </div>
  <p class="hint" id="hint">Still stuck after a few minutes? Let your coach or academy know.</p>
  <footer id="meta"></footer>
</main>
<script>
(function () {
  "use strict";
  var root = document.documentElement;

  // Same saved choice as the app (apps/web/src/app/layout.tsx); this page shares its origin.
  try {
    var saved = JSON.parse(localStorage.getItem("nexa-chess-theme") || "{}");
    var pref = saved.preference || saved.mode;
    if (pref === "dark" || pref === "light") root.dataset.theme = pref;
  } catch (e) { /* follow the system */ }

  // The brand line: never guess an academy's name, hide it instead.
  try {
    var brand = /(^|\.)nexachess\.in$/.test(location.hostname)
      ? "Nexa Chess"
      : (JSON.parse(localStorage.getItem("nexa-brand") || "{}").name || "");
    if (typeof brand === "string" && brand.trim()) {
      document.getElementById("brand").textContent = brand.trim();
      document.getElementById("brand").hidden = false;
    }
  } catch (e) { /* no brand line */ }

  // Shown in place of the big code while a deploy swaps containers (a "502" there would alarm people).
  var ICONS = {
    refresh: '<path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/>'
  };

  // mode -> copy, big icon (else the error code), how often to look (ms) and the cap for backing off.
  var MODES = {
    deploying: {
      title: "Updating to a new version",
      body: "This usually takes less than a minute. The page will reload by itself when it's ready.",
      icon: "refresh", spin: true, every: 4000, max: 10000, hint: false
    },
    maintenance: {
      title: "Scheduled maintenance",
      body: "We're doing some planned work to keep things running smoothly. The page will reload by itself when we're back.",
      every: 20000, max: 60000, hint: false
    },
    slow: {
      title: "This is taking longer than usual",
      body: "The server didn't answer in time. We're trying again automatically, so there's no need to refresh.",
      every: 6000, max: 30000, hint: true
    },
    down: {
      title: "We'll be right back",
      body: "The app isn't responding at the moment. We're retrying automatically, so there's no need to refresh.",
      every: 6000, max: 30000, hint: true
    }
  };
  // A deploy marker older than this was left behind by a killed deploy: show the plain outage copy.
  var DEPLOY_STALE_MS = 20 * 60 * 1000;

  var $ = function (id) { return document.getElementById(id); };
  var status = 0;
  try {
    var nav = performance.getEntriesByType("navigation")[0];
    status = (nav && nav.responseStatus) || 0;
  } catch (e) { /* older browsers */ }

  var mode = MODES.down, delay = mode.every, timer = null, countdown = null, nextAt = 0, busy = false;

  function render(name, data) {
    mode = MODES[name];
    delay = mode.every;
    $("title").textContent = mode.title;
    $("body").textContent = (data && typeof data.message === "string" && data.message.trim()) || mode.body;
    var code = status >= 500 ? status : name === "maintenance" ? 503 : name === "slow" ? 504 : 502;
    var big = $("code");
    if (mode.icon) {
      big.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + ICONS[mode.icon] + "</svg>";
    } else {
      big.textContent = String(code);
    }
    big.className = "code" + (mode.spin ? " spin" : "");
    $("hint").hidden = !mode.hint;
    var eta = $("eta");
    var until = data && data.until ? new Date(data.until) : null;
    if (until && !isNaN(until.getTime()) && until.getTime() > Date.now()) {
      eta.textContent = "Expected back by " + until.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) + ".";
      eta.hidden = false;
    } else {
      eta.hidden = true;
    }
    $("meta").textContent = "Error " + code + " · " + new Date().toLocaleString([], { dateStyle: "medium", timeStyle: "short" });
    document.title = mode.title;
  }

  function getJson(url) {
    return fetch(url, { cache: "no-store", credentials: "omit" })
      .then(function (r) { return r.ok ? r.json() : null; })
      .catch(function () { return null; });
  }

  function detectMode() {
    return Promise.all([getJson("/__status/maintenance.json"), getJson("/__status/deploying.json")]).then(function (res) {
      var maintenance = res[0], deploying = res[1];
      if (maintenance) return render("maintenance", maintenance);
      var since = deploying && deploying.since ? new Date(deploying.since).getTime() : NaN;
      if (deploying && !isNaN(since) && Date.now() - since < DEPLOY_STALE_MS) return render("deploying", deploying);
      render(status === 504 ? "slow" : "down");
    });
  }

  // The app answers again (anything below 500, or a redirect) -> back to the address they asked for.
  function probe() {
    return fetch(location.href, { method: "HEAD", cache: "no-store", redirect: "manual", credentials: "same-origin" })
      .then(function (r) { return r.type === "opaqueredirect" || (r.status > 0 && r.status < 500); })
      .catch(function () { return false; });
  }

  function schedule() {
    clearTimeout(timer);
    clearInterval(countdown);
    nextAt = Date.now() + delay;
    timer = setTimeout(check, delay);
    tick();
    countdown = setInterval(tick, 1000);
  }

  function tick() {
    var s = Math.max(0, Math.ceil((nextAt - Date.now()) / 1000));
    $("checkText").textContent = s > 0 ? "Checking again in " + s + "s" : "Checking…";
  }

  function check() {
    if (busy) return;
    busy = true;
    clearTimeout(timer);
    clearInterval(countdown);
    $("check").className = "check checking";
    $("checkText").textContent = "Checking…";
    $("retry").disabled = true;
    probe().then(function (up) {
      if (up) {
        $("checkText").textContent = "Back online. Reloading…";
        location.replace(location.href);
        return;
      }
      return detectMode().then(function () {
        busy = false;
        $("check").className = "check";
        $("retry").disabled = false;
        delay = Math.min(Math.round(delay * 1.5), mode.max);
        schedule();
      });
    });
  }

  $("retry").addEventListener("click", function () { delay = mode.every; check(); });
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible" && !busy) { delay = mode.every; check(); }
  });

  // Opened directly (https://<host>/__status/page.html?mode=deploying): show a state, never poll,
  // because the app is up and the probe would reload this page in a loop.
  if (location.pathname.indexOf("/__status/") === 0) {
    var wanted = new URLSearchParams(location.search).get("mode");
    var name = MODES.hasOwnProperty(wanted) ? wanted : "down";
    render(name, name === "maintenance" ? { until: new Date(Date.now() + 45 * 60000).toISOString() } : null);
    $("checkText").textContent = "Preview: not checking";
    $("retry").disabled = true;
    return;
  }

  detectMode().then(schedule);
})();
</script>
</body>
</html>
