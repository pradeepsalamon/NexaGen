name: Deploy Production

on:
  push:
    branches:
      - main
  # Manual redeploy, e.g. after a failed run (a later push that touches no app
  # files would otherwise never deploy it), or a manual rollback.
  workflow_dispatch:
    inputs:
      action:
        description: "deploy = build + ship main; rollback = restore the images that ran before the last successful deploy (no rebuild, no CI)"
        type: choice
        options: [deploy, rollback]
        default: deploy
      services:
        description: "Services (rollback: 'both' means whatever the last deploy changed)"
        type: choice
        options: [both, api, web]
        default: both

# One production run at a time, never cancelled mid-deploy. GitHub keeps at
# most one run pending per group and a newer one replaces it, so a burst of
# pushes deploys the newest commit once. The VPS script adds its own flock and
# refuses to deploy a commit older than the one live, which also covers a deploy
# started by hand on the box.
concurrency:
  group: production
  cancel-in-progress: false

# Least privilege by default; jobs that need more ask for it.
permissions:
  contents: read

jobs:
  detect-changes:
    if: github.event_name == 'push' || inputs.action != 'rollback'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      web: ${{ github.event_name == 'workflow_dispatch' && (inputs.services == 'both' || inputs.services == 'web') || steps.filter.outputs.web }}
      api: ${{ github.event_name == 'workflow_dispatch' && (inputs.services == 'both' || inputs.services == 'api') || steps.filter.outputs.api }}
    steps:
      - name: Checkout code
        if: github.event_name == 'push'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # Diff against the last push whose deploy run succeeded, not just the
      # previous push: a push whose deploy failed would otherwise never be
      # redeployed by a later push that touches other files.
      - name: Find the last successful deploy
        if: github.event_name == 'push'
        id: last-deploy
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          sha=$(gh api "repos/$REPO/actions/workflows/deploy-production.yml/runs?branch=main&event=push&status=success&per_page=1" \
            --jq '.workflow_runs[0].head_sha // empty' 2>/dev/null) || sha=""
          if [ -n "$sha" ] && git cat-file -e "$sha^{commit}" 2>/dev/null; then
            echo "Comparing against the last successful deploy: $sha"
          else
            sha="${{ github.event.before }}"
            echo "No usable successful deploy found; comparing against the previous push: $sha"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Detect affected services
        if: github.event_name == 'push'
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filter
        with:
          base: ${{ steps.last-deploy.outputs.sha }}
          filters: |
            web:
              - 'apps/web/**'
              - 'packages/**'
              - 'docker-compose.yml'
              - 'docker-compose*.yml'
              - 'package.json'
              - 'package-lock.json'
              - 'turbo.json'
            api:
              - 'apps/api/**'
              - 'prisma/**'
              - 'packages/**'
              - 'docker-compose.yml'
              - 'docker-compose*.yml'
              - 'package.json'
              - 'package-lock.json'
              - 'turbo.json'

  # No CI here: the `main: CI before merge` ruleset only lets a PR merge when it
  # is up to date with main and its CI passed, so the pushed commit has the same
  # tree as code CI already tested.
  deploy:
    needs: detect-changes
    if: needs.detect-changes.outputs.web == 'true' || needs.detect-changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        env:
          WEB_CHANGED: ${{ needs.detect-changes.outputs.web }}
          API_CHANGED: ${{ needs.detect-changes.outputs.api }}
          COMMIT_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          envs: WEB_CHANGED,API_CHANGED,COMMIT_SHA
          command_timeout: 45m
          script: |
            echo "========================================"
            echo "NEXA PRODUCTION DEPLOYMENT"
            echo "========================================"
            echo "Commit: $COMMIT_SHA"
            
            SERVICES=""
            if [ "$WEB_CHANGED" = "true" ]; then
              SERVICES="web"
            fi
            if [ "$API_CHANGED" = "true" ]; then
              SERVICES="$SERVICES api"
            fi
            
            # Trim leading/trailing whitespace
            SERVICES=$(echo $SERVICES | xargs)
            
            echo "Affected services: $SERVICES"
            
            if [ -z "$SERVICES" ]; then
              echo "No services affected. Exiting."
              exit 0
            fi
            
            # Navigate to the project directory
            cd /opt/nexa-chess/NexaGen || { echo "Failed to find project directory"; exit 1; }

            # Fetch the latest commit objects so we can extract the deployment script
            git fetch origin main || { echo "git fetch failed"; exit 1; }

            # Run the target commit's script from a temp file, never by
            # overwriting scripts/deploy-production.sh in the checkout: a deploy
            # already running would be reading that file.
            DEPLOY_SCRIPT=$(mktemp /tmp/nexa-deploy-production.XXXXXX.sh)
            if ! git show "$COMMIT_SHA:scripts/deploy-production.sh" > "$DEPLOY_SCRIPT" || [ ! -s "$DEPLOY_SCRIPT" ]; then
              echo "Could not extract scripts/deploy-production.sh at $COMMIT_SHA"
              rm -f "$DEPLOY_SCRIPT"
              exit 1
            fi
            bash "$DEPLOY_SCRIPT" "$COMMIT_SHA" $SERVICES
            STATUS=$?
            rm -f "$DEPLOY_SCRIPT"
            exit $STATUS

  # Manual rollback (Actions → Deploy Production → Run workflow → rollback).
  # Restores the images that were live before the last successful deploy and
  # checks out that commit; nothing is rebuilt, so it takes seconds, and CI is
  # skipped because those images already ran in production. Migrations are not
  # reversed. Allowed once per successful deploy.
  rollback:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'rollback'
    runs-on: ubuntu-latest
    steps:
      - name: Roll back on VPS
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        env:
          ROLLBACK_SERVICES: ${{ inputs.services }}
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          envs: ROLLBACK_SERVICES
          command_timeout: 15m
          script: |
            echo "========================================"
            echo "NEXA PRODUCTION ROLLBACK"
            echo "========================================"
            cd /opt/nexa-chess/NexaGen || { echo "Failed to find project directory"; exit 1; }
            git fetch origin main || { echo "git fetch failed"; exit 1; }
            # The rollback logic of main's newest script, not of whatever is
            # checked out (that may be the very commit being rolled back).
            DEPLOY_SCRIPT=$(mktemp /tmp/nexa-deploy-production.XXXXXX.sh)
            if ! git show "origin/main:scripts/deploy-production.sh" > "$DEPLOY_SCRIPT" || [ ! -s "$DEPLOY_SCRIPT" ]; then
              echo "Could not extract scripts/deploy-production.sh from origin/main"
              rm -f "$DEPLOY_SCRIPT"
              exit 1
            fi
            # "both" = whatever the last successful deploy changed.
            [ "$ROLLBACK_SERVICES" = "both" ] && ROLLBACK_SERVICES=""
            bash "$DEPLOY_SCRIPT" --rollback $ROLLBACK_SERVICES
            STATUS=$?
            rm -f "$DEPLOY_SCRIPT"
            exit $STATUS
