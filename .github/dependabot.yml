version: 2
updates:
  # One root lockfile covers every workspace.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    # Each automatic rebase re-runs CI. Comment "@dependabot rebase" when one is needed.
    rebase-strategy: disabled
    # Wait out freshly published versions, which can be malicious or broken.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Major upgrades are planned work, not bot PRs. Security updates ignore this rule.
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # Each automatic rebase re-runs CI. Comment "@dependabot rebase" when one is needed.
    rebase-strategy: disabled
    # Wait out freshly published versions, which can be malicious or broken.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - /apps/api
      - /apps/web
    schedule:
      interval: monthly
    # Each automatic rebase re-runs CI. Comment "@dependabot rebase" when one is needed.
    rebase-strategy: disabled
    # Wait out freshly published versions, which can be malicious or broken.
    cooldown:
      default-days: 7
    groups:
      node-image:
        patterns: ["*"]
    ignore:
      # A Node major is a runtime upgrade to plan, not a bot PR.
      - dependency-name: "*"
        update-types: [version-update:semver-major]
