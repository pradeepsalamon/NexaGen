services:
  postgres:
    image: postgres:15-alpine
    container_name: nexa_postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-nexa_chess}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    ports:
      - "127.0.0.1:5432:5432"

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-nexa_chess}" ]
      interval: 10s
      timeout: 5s
      retries: 5

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - nexa_network

  redis:
    image: redis:7-alpine
    container_name: nexa_redis
    restart: unless-stopped

    command: redis-server --appendonly yes

    deploy:
      resources:
        limits:
          memory: 512M

    volumes:
      - redis_data:/data

    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - nexa_network

  livekit:
    image: livekit/livekit-server:latest
    container_name: nexa_livekit
    restart: unless-stopped

    command: --config /etc/livekit.yaml

    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
      LIVEKIT_API_KEY: "${LIVEKIT_API_KEY}"
      LIVEKIT_API_SECRET: "${LIVEKIT_API_SECRET}"
      LIVEKIT_WEBHOOK_API_KEY: "${LIVEKIT_API_KEY}"
      LIVEKIT_WEBHOOK_URLS: "http://api:3001/webhooks/livekit"

    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro

    depends_on:
      redis:
        condition: service_healthy

    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-50010:50000-50010/udp"

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - nexa_network

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile

    container_name: nexa_api
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      livekit:
        condition: service_started

    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nexa_chess}?schema=public

      NODE_ENV: production
      PORT: 3001

      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-7d}
      JWT_REFRESH_SHORT_TTL: ${JWT_REFRESH_SHORT_TTL:-1d}

      CORS_ORIGIN: ${CORS_ORIGIN}
      FRONTEND_URL: ${FRONTEND_URL}

      LIVEKIT_URL: ${LIVEKIT_URL}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}

      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}

      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}

      NEXT_PUBLIC_CONTACT_EMAIL: ${NEXT_PUBLIC_CONTACT_EMAIL}
      ADMIN_EMAILS: ${ADMIN_EMAILS}

      TRASH_RETENTION_DAYS: ${TRASH_RETENTION_DAYS:-30}

      STOCKFISH_PATH: ${STOCKFISH_PATH:-stockfish}
      STOCKFISH_POOL_SIZE: ${STOCKFISH_POOL_SIZE:-4}

      OCI_REGION: ${OCI_REGION}
      OCI_NAMESPACE: ${OCI_NAMESPACE}
      OCI_BUCKET_NAME: ${OCI_BUCKET_NAME}
      OCI_ACCESS_KEY_ID: ${OCI_ACCESS_KEY_ID}
      OCI_SECRET_ACCESS_KEY: ${OCI_SECRET_ACCESS_KEY}

    ports:
      - "3001:3001"

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('net').connect(3001,'127.0.0.1',()=>process.exit(0)).on('error',()=>process.exit(1))"
        ]
      interval: 15s
      timeout: 5s
      retries: 5

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - nexa_network

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_LIVEKIT_URL: ${NEXT_PUBLIC_LIVEKIT_URL}

    container_name: nexa_web
    restart: unless-stopped

    depends_on:
      api:
        condition: service_healthy

    ports:
      - "3000:3000"

    # Replace with /health if implemented.
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/" ]
      interval: 15s
      timeout: 5s
      retries: 5

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - nexa_network

volumes:
  postgres_data:
  redis_data:

networks:
  nexa_network:
    driver: bridge
