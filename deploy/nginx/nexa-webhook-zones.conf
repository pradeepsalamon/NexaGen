# Webhook rate limits: http-level zones. Include once, at the top of the site
# file (outside any server block), after the `$real_client_ip` map.
# docs/WHATSAPP_SUPPORT.md § "Edge rate limit".
#
# The API already rejects an unsigned WhatsApp webhook (X-Hub-Signature-256),
# but checking a signature still costs a request; this keeps one address from
# flooding it. Meta delivers from a pool of addresses and bursts after an
# outage, so the per-address rate is generous.
limit_req_zone $real_client_ip zone=nexa_whatsapp_webhook:10m rate=20r/s;
