name: Security scan

# Semgrep static analysis. Separate from ci.yml so it never gates a deploy.
# A PR fails only on findings it introduces; the weekly full scan reports the rest.
on:
  pull_request:
    branches:
      - main
      - dev
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: semgrep/semgrep
    env:
      RULES: >-
        --config p/javascript --config p/typescript --config p/react
        --config p/nextjs --config p/nodejsscan --config p/jwt
        --config p/secrets --config p/owasp-top-ten
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Scan new code (PR)
        if: github.event_name == 'pull_request'
        run: >-
          semgrep scan $RULES --metrics off --error
          --baseline-commit ${{ github.event.pull_request.base.sha }}
          --sarif-output semgrep.sarif

      - name: Full scan (report only)
        if: github.event_name != 'pull_request'
        run: semgrep scan $RULES --metrics off --sarif-output semgrep.sarif

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-results
          path: semgrep.sarif
          if-no-files-found: ignore
