# Inside `location /` of a web or API server block (after `set $nexa_status_env`).
# `nexa.sh maintenance on <env>` creates the file; the server's error_page then
# serves the status page (web) or the JSON (API). docs/SERVICE_STATUS.md
if (-f /var/www/nexa-status/$nexa_status_env/maintenance.json) {
    return 503;
}
