# Service status page for a WEB server block. docs/SERVICE_STATUS.md
#
#   set $nexa_status_env prod;               # or stage: picks /var/www/nexa-status/<env>/
#   include /etc/nginx/snippets/nexa-status-web.conf;
#   location / {
#       include /etc/nginx/snippets/nexa-maintenance-gate.conf;
#       proxy_pass ...;
#   }
#
# 502/504: nginx could not reach the app (deploy swap, crash, restart loop).
# 503: the maintenance gate. Errors the app itself returns pass through untouched
# (no proxy_intercept_errors).
error_page 502 503 504 /__status/page.html;

location = /__status/page.html {
    root /var/www/nexa-status;
    try_files /$nexa_status_env/page.html =404;
    default_type text/html;
    charset utf-8;
    add_header Cache-Control "no-store" always;
    add_header Retry-After "30" always;
    add_header X-Robots-Tag "noindex" always;
}

# Read by the page to pick its wording; written by deploy-production.sh and `nexa.sh maintenance`.
location ~ ^/__status/(maintenance|deploying)\.json$ {
    root /var/www/nexa-status;
    try_files /$nexa_status_env/$1.json =404;
    default_type application/json;
    add_header Cache-Control "no-store" always;
}
