# Service status pages: http-level maps. Include once, at the top of the site
# file (outside any server block). docs/SERVICE_STATUS.md
#
# Origins that may read the API's "unavailable" JSON cross-origin. Mirror the
# API's CORS_ORIGIN; an academy's own address calls /api on its own origin and
# needs no entry.
map $http_origin $nexa_status_cors_origin {
    default "";
    "https://nexachess.in" $http_origin;
    "https://www.nexachess.in" $http_origin;
    "https://dev.nexachess.in" $http_origin;
}
