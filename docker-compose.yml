services:
  postgres:
    image: postgres:15-alpine
    container_name: nexa_postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-nexa_chess}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    ports:
      - "127.0.0.1:5432:5432"

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-nexa_chess}" ]
      interval: 10s
      timeout: 5s
      retries: 5

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - nexa_network

  redis:
    image: redis:7-alpine
    container_name: nexa_redis
    restart: unless-stopped

    command: redis-server --appendonly yes

    # Loopback-only, like postgres — lets `npm run dev:api` on the host reach
    # the same Redis the containers use (start it with `npm run prod:db`).
    ports:
      - "127.0.0.1:6379:6379"

    deploy:
      resources:
        limits:
          memory: 512M

    volumes:
      - redis_data:/data

    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - nexa_network

  livekit:
    image: livekit/livekit-server:${LIVEKIT_SERVER_VERSION:-v1.13.9}
    container_name: nexa_livekit
    restart: unless-stopped

    # Config is passed inline via LIVEKIT_CONFIG (not a mounted file) so Docker
    # Compose interpolates ${LIVEKIT_API_KEY} into webhook.api_key before the
    # container starts — livekit-server does not expand env vars inside a config
    # file, and the webhook block is what drives coach/board attendance events.
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
      LIVEKIT_API_KEY: "${LIVEKIT_API_KEY}"
      LIVEKIT_API_SECRET: "${LIVEKIT_API_SECRET}"
      LIVEKIT_CONFIG: |
        port: 7880
        bind_addresses:
          - ""
        rtc:
          tcp_port: 7881
          # One muxed UDP port for every participant. The old 50000-50010 range
          # allowed ~11 peer connections before everyone else fell back to TCP.
          udp_port: 7882
          use_external_ip: true
          node_ip: ${LIVEKIT_NODE_IP:-146.56.55.170}
        # Embedded TURN for students on networks that block UDP / odd ports.
        # Needs a DNS name pointing at this box and a cert for it (certbot).
        turn:
          enabled: ${LIVEKIT_TURN_ENABLED:-false}
          domain: ${LIVEKIT_TURN_DOMAIN:-}
          tls_port: ${LIVEKIT_TURN_TLS_PORT:-5349}
          udp_port: 3478
          external_tls: false
          cert_file: /etc/letsencrypt/live/${LIVEKIT_TURN_DOMAIN:-none}/fullchain.pem
          key_file: /etc/letsencrypt/live/${LIVEKIT_TURN_DOMAIN:-none}/privkey.pem
        redis:
          address: redis:6379
        webhook:
          api_key: ${LIVEKIT_API_KEY}
          urls:
            - http://api:3001/webhooks/livekit

    depends_on:
      redis:
        condition: service_healthy

    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro

    # Signalling (7880) is reached through nginx TLS, so it stays on loopback.
    ports:
      - "127.0.0.1:7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
      - "${LIVEKIT_TURN_TLS_PORT:-5349}:${LIVEKIT_TURN_TLS_PORT:-5349}"
      - "3478:3478/udp"

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - nexa_network

  egress:
    image: livekit/egress:${LIVEKIT_EGRESS_VERSION:-v1.14.1}
    container_name: nexa_egress
    restart: unless-stopped
    environment:
      EGRESS_CONFIG_BODY: |
        api_key: ${LIVEKIT_API_KEY}
        api_secret: ${LIVEKIT_API_SECRET}
        ws_url: ws://livekit:7880
        redis:
          address: redis:6379
        # This VPS has 2 vCPUs. Egress' default room-composite cost is 4, so the
        # node advertised itself as unable to run *any* composite egress and
        # every StartRoomCompositeEgress request timed out with no node picking
        # it up ("not enough cpu for some egress types" on boot). Costs are a
        # scheduling budget, not a limit — lowering them lets this single-node
        # deployment accept one class recording at a time. The API pins the
        # 720p30 preset so the job fits in what the box can actually encode.
        cpu_cost:
          room_composite_cpu_cost: 1.5
          web_cpu_cost: 1.5
          audio_room_composite_cpu_cost: 0.5
          audio_web_cpu_cost: 0.5
          participant_cpu_cost: 1.0
          track_composite_cpu_cost: 1.0
          track_cpu_cost: 0.5
    volumes:
      - ${RECORDING_STORAGE_HOST_DIR:-./recordings}:${RECORDING_STORAGE_DIR:-/recordings}
    cap_add:
      - SYS_ADMIN
    depends_on:
      redis:
        condition: service_healthy
      livekit:
        condition: service_started
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - nexa_network

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile

    container_name: nexa_api
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      livekit:
        condition: service_started

    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nexa_chess}?schema=public

      NODE_ENV: production
      PORT: 3001
      # JSON logs to stdout (nestjs-pino). info by default in production.
      LOG_LEVEL: ${LOG_LEVEL:-info}

      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-7d}
      JWT_REFRESH_SHORT_TTL: ${JWT_REFRESH_SHORT_TTL:-1d}

      # Two-factor sign-in. Unset key = MFA unavailable; roles listed must use it.
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:-}
      MFA_REQUIRED_ROLES: ${MFA_REQUIRED_ROLES:-SUPER_ADMIN,ADMIN}

      # Constant-time-ish auth responses so a client can't tell "wrong password"
      # from "no such account" apart by response latency.
      LOGIN_RESPONSE_DELAY: ${LOGIN_RESPONSE_DELAY:-500ms}
      PASSWORD_RESET_RESPONSE_DELAY: ${PASSWORD_RESET_RESPONSE_DELAY:-5s}

      CORS_ORIGIN: ${CORS_ORIGIN}
      FRONTEND_URL: ${FRONTEND_URL}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-lax}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}

      LIVEKIT_URL: ${LIVEKIT_URL}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}

      # Error reporting (optional). Unset SENTRY_DSN sends nothing.
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}

      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}

      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}

      NEXT_PUBLIC_CONTACT_EMAIL: ${NEXT_PUBLIC_CONTACT_EMAIL}
      ADMIN_EMAILS: ${ADMIN_EMAILS}

      TRASH_RETENTION_DAYS: ${TRASH_RETENTION_DAYS:-30}

      # BullMQ. Shared with livekit/egress, so QUEUE_PREFIX namespaces the keys.
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      QUEUE_PREFIX: ${QUEUE_PREFIX:-nexa}
      QUEUE_CONCURRENCY: ${QUEUE_CONCURRENCY:-5}

      STOCKFISH_PATH: ${STOCKFISH_PATH:-stockfish}
      STOCKFISH_POOL_SIZE: ${STOCKFISH_POOL_SIZE:-4}
      STOCKFISH_MIN_ENGINES: ${STOCKFISH_MIN_ENGINES:-1}
      STOCKFISH_IDLE_TIMEOUT_S: ${STOCKFISH_IDLE_TIMEOUT_S:-60}
      STOCKFISH_MOVETIME: ${STOCKFISH_MOVETIME:-800}
      STOCKFISH_MOVE_MOVETIME: ${STOCKFISH_MOVE_MOVETIME:-1000}
      STOCKFISH_MOVE_MAX_DEPTH: ${STOCKFISH_MOVE_MAX_DEPTH:-22}
      STOCKFISH_HASH_MB: ${STOCKFISH_HASH_MB:-64}
      STOCKFISH_MAX_DEPTH: ${STOCKFISH_MAX_DEPTH:-20}
      # Game analysis + online game import (docs/GAME_ANALYSIS.md, docs/GAME_SOURCES.md)
      GAME_ANALYSIS_ENABLED: ${GAME_ANALYSIS_ENABLED:-true}
      GAME_ANALYSIS_WORKER: ${GAME_ANALYSIS_WORKER:-true}
      GAME_ANALYSIS_CONCURRENCY: ${GAME_ANALYSIS_CONCURRENCY:-1}
      GAME_ANALYSIS_DAILY_LIMIT: ${GAME_ANALYSIS_DAILY_LIMIT:-20}
      GAME_ANALYSIS_AUTO_LIVE_GAMES: ${GAME_ANALYSIS_AUTO_LIVE_GAMES:-false}
      EXTERNAL_GAME_IMPORT_ENABLED: ${EXTERNAL_GAME_IMPORT_ENABLED:-false}

      # WhatsApp Cloud API. Unset ACCESS_TOKEN/PHONE_NUMBER_ID leaves
      # WhatsAppService unconfigured — callers degrade, nothing breaks.
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID}
      WHATSAPP_API_BASE_URL: ${WHATSAPP_API_BASE_URL:-https://graph.facebook.com}
      WHATSAPP_API_VERSION: ${WHATSAPP_API_VERSION:-v21.0}
      WHATSAPP_DEFAULT_COUNTRY_CODE: ${WHATSAPP_DEFAULT_COUNTRY_CODE}
      WHATSAPP_TIMEOUT_MS: ${WHATSAPP_TIMEOUT_MS:-10000}

      # Admin analytics thresholds/cache — see CLAUDE.md's analytics debug row.
      ANALYTICS_STORAGE_WARN_PERCENT: ${ANALYTICS_STORAGE_WARN_PERCENT:-70}
      ANALYTICS_STORAGE_CRITICAL_PERCENT: ${ANALYTICS_STORAGE_CRITICAL_PERCENT:-85}
      ANALYTICS_LOW_ATTENDANCE_PERCENT: ${ANALYTICS_LOW_ATTENDANCE_PERCENT:-75}
      ANALYTICS_INACTIVE_DAYS: ${ANALYTICS_INACTIVE_DAYS:-30}
      ANALYTICS_CACHE_TTL_SECONDS: ${ANALYTICS_CACHE_TTL_SECONDS:-300}

      RECORDING_STORAGE_DIR: ${RECORDING_STORAGE_DIR:-/recordings}
      RECORDING_STORAGE_LIMIT_GB: ${RECORDING_STORAGE_LIMIT_GB:-130}
      RECORDING_MIN_RETENTION_DAYS: ${RECORDING_MIN_RETENTION_DAYS:-14}
      LIVE_CLASS_COACH_ABSENT_GRACE_MINUTES: ${LIVE_CLASS_COACH_ABSENT_GRACE_MINUTES:-10}
      LIVE_CLASS_MAX_OVERRUN_MINUTES: ${LIVE_CLASS_MAX_OVERRUN_MINUTES:-60}
      RECORDING_STORAGE_TARGET: ${RECORDING_STORAGE_TARGET:-local}
      # Reached by the egress container over the compose network, so this is the
      # `web` service, not the public hostname.
      RECORDING_TEMPLATE_BASE_URL: ${RECORDING_TEMPLATE_BASE_URL:-http://web:3000}

      # Payments. Each gateway is optional: unset credentials make it report
      # itself unconfigured, the router skips it, and the checkout screen stops
      # offering the methods only it could serve.
      PAYMENTS_ENABLED: ${PAYMENTS_ENABLED:-true}
      PAYMENTS_MODE: ${PAYMENTS_MODE:-sandbox}
      PAYMENTS_DEFAULT_CURRENCY: ${PAYMENTS_DEFAULT_CURRENCY:-INR}
      PAYMENTS_ORDER_TTL_MINUTES: ${PAYMENTS_ORDER_TTL_MINUTES:-30}
      PAYMENTS_HTTP_TIMEOUT_MS: ${PAYMENTS_HTTP_TIMEOUT_MS:-15000}
      PAYMENTS_HEALTH_WINDOW_HOURS: ${PAYMENTS_HEALTH_WINDOW_HOURS:-24}
      PAYMENTS_HEALTH_MIN_SUCCESS_RATE: ${PAYMENTS_HEALTH_MIN_SUCCESS_RATE:-40}
      PAYMENTS_HEALTH_MIN_SAMPLES: ${PAYMENTS_HEALTH_MIN_SAMPLES:-10}
      PAYMENTS_INVOICE_PREFIX: ${PAYMENTS_INVOICE_PREFIX:-NEXA}
      PAYMENTS_SELLER_NAME: ${PAYMENTS_SELLER_NAME}
      PAYMENTS_SELLER_ADDRESS: ${PAYMENTS_SELLER_ADDRESS}
      PAYMENTS_SELLER_TAX_ID: ${PAYMENTS_SELLER_TAX_ID}
      PAYMENTS_TAX_LABEL: ${PAYMENTS_TAX_LABEL:-GST}

      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET}

      CASHFREE_APP_ID: ${CASHFREE_APP_ID}
      CASHFREE_SECRET_KEY: ${CASHFREE_SECRET_KEY}
      CASHFREE_WEBHOOK_SECRET: ${CASHFREE_WEBHOOK_SECRET}
      CASHFREE_API_VERSION: ${CASHFREE_API_VERSION:-2023-08-01}

      # Only the PUBLISHABLE key ever reaches a browser, and it is served by the
      # API in a checkout response — never baked into the web build.
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_API_VERSION: ${STRIPE_API_VERSION:-2024-06-20}

      # OCI Object Storage — DB backups (backup module) and the download
      # fallback for recordings not on local disk. Still required.
      OCI_REGION: ${OCI_REGION}
      OCI_NAMESPACE: ${OCI_NAMESPACE}
      OCI_BUCKET_NAME: ${OCI_BUCKET_NAME}
      OCI_ACCESS_KEY_ID: ${OCI_ACCESS_KEY_ID}
      OCI_SECRET_ACCESS_KEY: ${OCI_SECRET_ACCESS_KEY}

    volumes:
      - ${RECORDING_STORAGE_HOST_DIR:-./recordings}:${RECORDING_STORAGE_DIR:-/recordings}

    # Loopback only: nginx is the public entry point. Docker bypasses ufw, so a
    # bare "3001:3001" was reachable from the internet around nginx.
    ports:
      - "127.0.0.1:3001:3001"

    # /health/ready fails (503) when Postgres is unreachable, so the deploy
    # gate rejects an API that boots but can't reach its database.
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health/ready').then((r)=>process.exit(r.ok?0:1),()=>process.exit(1))"
        ]
      interval: 15s
      timeout: 5s
      retries: 5

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - nexa_network

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_LIVEKIT_URL: ${NEXT_PUBLIC_LIVEKIT_URL}
        # Canonical/sitemap/Open Graph origin (bare domain, not www).
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://nexachess.in}
        # Google Search Console HTML-tag verification token (optional).
        NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION:-}
        NEXT_PUBLIC_BING_SITE_VERIFICATION: ${NEXT_PUBLIC_BING_SITE_VERIFICATION:-}
        # Error reporting (optional). The DSN is baked in at build time.
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
        NEXT_PUBLIC_SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
        SENTRY_AUTH_TOKEN: ${SENTRY_AUTH_TOKEN:-}
        SENTRY_ORG: ${SENTRY_ORG:-}
        SENTRY_PROJECT: ${SENTRY_WEB_PROJECT:-}
        SENTRY_RELEASE: ${SENTRY_RELEASE:-}

    container_name: nexa_web
    restart: unless-stopped

    depends_on:
      api:
        condition: service_healthy

    ports:
      - "127.0.0.1:3000:3000"

    # Replace with /health if implemented.
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/" ]
      interval: 15s
      timeout: 5s
      retries: 5

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - nexa_network

volumes:
  postgres_data:
  redis_data:

networks:
  nexa_network:
    driver: bridge
