name: CI

# The gate every production deploy waits on (deploy-production.yml calls this
# workflow), and the check a pull request into main/dev runs.
on:
  pull_request:
    branches:
      - main
      - dev
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: "20"
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    name: Typecheck, lint, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - run: npm run typecheck

      - run: npm run lint

      - name: API unit tests
        run: npm test

  migrations:
    name: Migrations, schema drift, DB integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        # Same major as docker-compose.yml.
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nexa_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nexa_ci?schema=public
      INTEGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nexa_ci?schema=public
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Apply every migration to an empty database
        run: npm run db:migrate:deploy

      # Exit code 2 = schema.prisma has changes no migration creates.
      - name: Check schema.prisma has no unmigrated changes
        working-directory: apps/api
        run: |
          npx prisma migrate diff \
            --from-url "$DATABASE_URL" \
            --to-schema-datamodel prisma/schema.prisma \
            --exit-code --script

      - name: Generate Prisma client
        run: npm run db:generate

      # The API imports the shared packages from their dist/ output.
      - name: Build shared packages
        run: npx turbo run build --filter="./packages/*"

      # Real-Postgres tests (`*.int-spec.ts`), with a non-UTC session zone.
      # Runs after the drift check: global setup sets the database timezone.
      - name: DB integration tests
        run: npm run test:integration

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: next-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: next-${{ hashFiles('package-lock.json') }}-

      # Catches what typecheck can't: RSC/client boundary errors, Nest build config.
      - run: npm run build
