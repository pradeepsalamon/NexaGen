services:
  postgres:
    image: postgres:15-alpine
    container_name: nexa_postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-nexa_chess}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    ports:
      - "127.0.0.1:5432:5432"

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-nexa_chess}" ]
      interval: 10s
      timeout: 5s
      retries: 5

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - nexa_network

  redis:
    image: redis:7-alpine
    container_name: nexa_redis
    restart: unless-stopped

    command: redis-server --appendonly yes

    # Loopback-only, like postgres — lets `npm run dev:api` on the host reach
    # the same Redis the containers use (start it with `npm run prod:db`).
    ports:
      - "127.0.0.1:6379:6379"

    deploy:
      resources:
        limits:
          memory: 512M

    volumes:
      - redis_data:/data

    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - nexa_network

  livekit:
    image: livekit/livekit-server:latest
    container_name: nexa_livekit
    restart: unless-stopped

    # Config is passed inline via LIVEKIT_CONFIG (not a mounted file) so Docker
    # Compose interpolates ${LIVEKIT_API_KEY} into webhook.api_key before the
    # container starts — livekit-server does not expand env vars inside a config
    # file, and the webhook block is what drives coach/board attendance events.
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
      LIVEKIT_API_KEY: "${LIVEKIT_API_KEY}"
      LIVEKIT_API_SECRET: "${LIVEKIT_API_SECRET}"
      LIVEKIT_CONFIG: |
        port: 7880
        bind_addresses:
          - ""
        rtc:
          tcp_port: 7881
          port_range_start: 50000
          port_range_end: 50010
          use_external_ip: true
          node_ip: 146.56.55.170
        redis:
          address: redis:6379
        webhook:
          api_key: ${LIVEKIT_API_KEY}
          urls:
            - http://api:3001/webhooks/livekit

    depends_on:
      redis:
        condition: service_healthy

    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-50010:50000-50010/udp"

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - nexa_network

  egress:
    image: livekit/egress:latest
    container_name: nexa_egress
    restart: unless-stopped
    environment:
      EGRESS_CONFIG_BODY: |
        api_key: ${LIVEKIT_API_KEY}
        api_secret: ${LIVEKIT_API_SECRET}
        ws_url: ws://livekit:7880
        redis:
          address: redis:6379
        # This VPS has 2 vCPUs. Egress' default room-composite cost is 4, so the
        # node advertised itself as unable to run *any* composite egress and
        # every StartRoomCompositeEgress request timed out with no node picking
        # it up ("not enough cpu for some egress types" on boot). Costs are a
        # scheduling budget, not a limit — lowering them lets this single-node
        # deployment accept one class recording at a time. The API pins the
        # 720p30 preset so the job fits in what the box can actually encode.
        cpu_cost:
          room_composite_cpu_cost: 1.5
          web_cpu_cost: 1.5
          audio_room_composite_cpu_cost: 0.5
          audio_web_cpu_cost: 0.5
          participant_cpu_cost: 1.0
          track_composite_cpu_cost: 1.0
          track_cpu_cost: 0.5
    volumes:
      - ${RECORDING_STORAGE_HOST_DIR:-./recordings}:${RECORDING_STORAGE_DIR:-/recordings}
    cap_add:
      - SYS_ADMIN
    depends_on:
      redis:
        condition: service_healthy
      livekit:
        condition: service_started
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - nexa_network

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile

    container_name: nexa_api
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      livekit:
        condition: service_started

    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nexa_chess}?schema=public

      NODE_ENV: production
      PORT: 3001

      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-7d}
      JWT_REFRESH_SHORT_TTL: ${JWT_REFRESH_SHORT_TTL:-1d}

      CORS_ORIGIN: ${CORS_ORIGIN}
      FRONTEND_URL: ${FRONTEND_URL}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}

      LIVEKIT_URL: ${LIVEKIT_URL}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}

      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}

      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}

      NEXT_PUBLIC_CONTACT_EMAIL: ${NEXT_PUBLIC_CONTACT_EMAIL}
      ADMIN_EMAILS: ${ADMIN_EMAILS}

      TRASH_RETENTION_DAYS: ${TRASH_RETENTION_DAYS:-30}

      # BullMQ. Shared with livekit/egress, so QUEUE_PREFIX namespaces the keys.
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      QUEUE_PREFIX: ${QUEUE_PREFIX:-nexa}
      QUEUE_CONCURRENCY: ${QUEUE_CONCURRENCY:-5}

      STOCKFISH_PATH: ${STOCKFISH_PATH:-stockfish}
      STOCKFISH_POOL_SIZE: ${STOCKFISH_POOL_SIZE:-4}

      RECORDING_STORAGE_DIR: ${RECORDING_STORAGE_DIR:-/recordings}
      RECORDING_STORAGE_LIMIT_GB: ${RECORDING_STORAGE_LIMIT_GB:-130}
      RECORDING_MIN_RETENTION_DAYS: ${RECORDING_MIN_RETENTION_DAYS:-14}
      RECORDING_STORAGE_TARGET: ${RECORDING_STORAGE_TARGET:-local}
      # Reached by the egress container over the compose network, so this is the
      # `web` service, not the public hostname.
      RECORDING_TEMPLATE_BASE_URL: ${RECORDING_TEMPLATE_BASE_URL:-http://web:3000}

      # OCI Object Storage — DB backups (backup module) and the download
      # fallback for recordings not on local disk. Still required.
      OCI_REGION: ${OCI_REGION}
      OCI_NAMESPACE: ${OCI_NAMESPACE}
      OCI_BUCKET_NAME: ${OCI_BUCKET_NAME}
      OCI_ACCESS_KEY_ID: ${OCI_ACCESS_KEY_ID}
      OCI_SECRET_ACCESS_KEY: ${OCI_SECRET_ACCESS_KEY}

    volumes:
      - ${RECORDING_STORAGE_HOST_DIR:-./recordings}:${RECORDING_STORAGE_DIR:-/recordings}

    ports:
      - "3001:3001"

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('net').connect(3001,'127.0.0.1',()=>process.exit(0)).on('error',()=>process.exit(1))"
        ]
      interval: 15s
      timeout: 5s
      retries: 5

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - nexa_network

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_LIVEKIT_URL: ${NEXT_PUBLIC_LIVEKIT_URL}

    container_name: nexa_web
    restart: unless-stopped

    depends_on:
      api:
        condition: service_healthy

    ports:
      - "3000:3000"

    # Replace with /health if implemented.
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/" ]
      interval: 15s
      timeout: 5s
      retries: 5

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - nexa_network

volumes:
  postgres_data:
  redis_data:

networks:
  nexa_network:
    driver: bridge
