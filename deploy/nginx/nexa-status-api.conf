# "Unavailable" JSON for an API server block, in the shape apps/web/src/lib/api.ts
# reads ({ message, code }), instead of nginx's HTML 502. docs/SERVICE_STATUS.md
#
#   set $nexa_status_env prod;
#   include /etc/nginx/snippets/nexa-status-api.conf;
#   location / {
#       include /etc/nginx/snippets/nexa-maintenance-gate.conf;
#       proxy_pass ...;
#   }
error_page 502 503 504 =503 /__status/api-unavailable.json;

location = /__status/api-unavailable.json {
    internal;
    root /var/www/nexa-status;
    try_files /$nexa_status_env/api-unavailable.json =503;
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header Retry-After "30" always;
    # Without these the browser hides the response and the app sees a bare network error.
    add_header Access-Control-Allow-Origin $nexa_status_cors_origin always;
    add_header Access-Control-Allow-Credentials "true" always;
    add_header Vary "Origin" always;
}
