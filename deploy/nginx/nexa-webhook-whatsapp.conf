# WhatsApp webhook with a per-address rate limit. Include inside every API
# server block, after `set $nexa_api_upstream <upstream name>;`, beside
# `location /`. Needs nexa-webhook-zones.conf at http level.
# docs/WHATSAPP_SUPPORT.md § "Edge rate limit".
#
#   set $nexa_api_upstream nestjs_api_upstream;
#   include /etc/nginx/snippets/nexa-webhook-whatsapp.conf;
#
# Covers /webhooks/whatsapp (Nexa) and /webhooks/whatsapp/<webhookKey> (other
# academies). Over the limit is a 429, which Meta retries with back-off.
location /webhooks/whatsapp {
    limit_req zone=nexa_whatsapp_webhook burst=100 nodelay;
    limit_req_status 429;
    # Meta's payloads are small; a large body here is not Meta.
    client_max_body_size 1m;

    include /etc/nginx/snippets/nexa-maintenance-gate.conf;
    # nosemgrep: generic.nginx.security.dynamic-proxy-host.dynamic-proxy-host -- the variable is a fixed upstream name set in the server block, never request data
    proxy_pass http://$nexa_api_upstream;
    proxy_http_version 1.1;

    # nosemgrep: generic.nginx.security.request-host-used.request-host-used -- the API finds the academy by host; server_name limits which hosts reach this block
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $real_client_ip;
    proxy_set_header X-Forwarded-For $real_client_ip;
    proxy_set_header X-Forwarded-Proto https;
    # No upgrade on a webhook; an empty Connection keeps the upstream pool's keepalive.
    proxy_set_header Connection "";

    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
}
